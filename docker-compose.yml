services:
  prooflens:
    build:
      context: .
      dockerfile: Dockerfile
    image: prooflens:latest
    container_name: prooflens-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - prooflens_storage:/app/storage
    restart: unless-stopped

volumes:
  prooflens_storage:

